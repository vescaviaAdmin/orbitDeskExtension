<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcript Saver</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="popup">
      <h1>Transcript Saver</h1>

      <p id="status" class="status">Not recording</p>

      <div class="actions">
        <button id="startButton" type="button">Start saving</button>
        <button id="stopButton" type="button" disabled>Stop and save</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
